# Worked example: DeadLetter, a Qt6 QML desktop email client with a daemon.
#
# Keys are flattened to dotted paths by lwforge, so [[preflight]] entries become
# preflight.0.type and so on. Array order survives the flattening, which matters
# for actions and hooks.

[product]
name         = "DeadLetter"
version      = "0.9.3"
publisher    = "Locke Werks"
description  = "Secure desktop email. Local-first, no telemetry."
copyright    = "Copyright (c) 2026 Locke Werks"
url          = "https://lockewerks.com/deadletter"
# Stable across versions. Upgrade detection and the single-instance mutex key
# off this, so changing it makes an upgrade look like a fresh product.
upgrade_code = "9f2c1a3e-7b41-4c8e-9a2d-5e6f8b1c4d70"
# No version component, so an upgrade keeps the same identity and taskbar pins
# and toast notifications survive it.
aumid        = "LockeWerks.DeadLetter"

[install]
scope     = "machine"
dir       = "{ProgramFiles}\\DeadLetter"
# The default. A machine-scope install writes to Program Files and HKLM, so it
# needs the rights up front. Per-user work does not go through this setting:
# see the post_install hook below, which drops back to the invoking user.
elevation = "required"

[ui]
warning = "DeadLetter rebuilds your mail store index on first run. Existing mail is not modified."
license_text = """
MIT License

