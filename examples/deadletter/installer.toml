"""

# Theme overrides are optional. Omitting the block gives the Locke Werks
# palette: #06060e background, #00cccc accent, 16px cards, 8px buttons.
# [ui.theme]
# accent = "#00cccc"

# Things the person installing gets to decide. Shown on a page between the
# license and the progress bar, and settable unattended as
# /O:desktop_shortcut=off. Recorded in the install manifest, so uninstall gates
# on the same answers rather than re-reading these defaults.
[[options]]
id      = "desktop_shortcut"
label   = "Put a shortcut on the desktop"
default = false

[[options]]
id      = "user_profile"
label   = "Set up my mail profile"
detail  = "Writes to your own profile directory. Runs as you, not as the administrator."
default = true

[[preflight]]
type = "os_build"
min  = 17763
fail = "Windows 10 version 1809 or later is required."

[[preflight]]
type = "free_disk_space"
bytes = 420000000
fail = "At least 400 MB of free space is required."

[[preflight]]
type = "process_not_running"
name = "deadletter.exe"
# Offer to close it through the Restart Manager rather than simply refusing.
restart_manager = true
fail = "Close DeadLetter before installing."

[[actions]]
type  = "shortcut"
# Must match the layout of the payload directory, not the product name. A
# shortcut to a path that does not exist is created without complaint by the
# shell and only fails when someone clicks it.
target = "{InstallDir}\\bin\\deadletter.exe"
where  = "common_programs"
name   = "DeadLetter"

[[actions]]
type   = "shortcut"
target = "{InstallDir}\\bin\\deadletter.exe"
where  = "desktop"
name   = "DeadLetter"
# Only created if the box was ticked. An undeclared id here fails the build,
# so renaming an option cannot leave a declaration that silently never fires.
when   = "desktop_shortcut"

[[actions]]
# Takes no keys of its own. DisplayName, Publisher, DisplayVersion and
# EstimatedSize are derived from [product] and the payload rather than restated,
# so the ARP entry and the winget manifest cannot disagree about what version
# this is. QuietUninstallString is always written, because that is what Intune,
# SCCM and winget actually invoke.
type = "arp"

[[hooks.post_install]]
id     = "register_daemon"
run    = "payload:bin\\deadletterd.exe"
args   = ["cmd"]
# "auto" makes lwforge fill in the real digest at build time and print it. An
# explicit digest is verified instead, and a mismatch fails the build.
#
# Pinning is what ties a hook to one specific set of bytes: the config lives
# inside the Authenticode-covered region, so changing either the digest or the
# binary it names invalidates the installer's signature.
sha256 = "auto"
expect_exit = [0]
timeout_ms = 30000
vital = false

# The per-user half of the install. as = "user" runs this unelevated, as
# whoever started setup, with their environment, so {UserLocalAppData} is their
# profile and the files it writes are owned by them.
#
# Without it, an installer that elevated writes into the administrator's profile
# under over-the-shoulder UAC, and even in the ordinary case leaves files owned
# by BUILTIN\Administrators that the product cannot rewrite later. Both failures
# are silent.
#
# Digest pinning is unchanged: it is checked by the elevated process before the
# token is dropped.
[[hooks.post_install]]
id     = "user_profile"
run    = "payload:bin\\deadletter.exe"
as     = "user"
when   = "user_profile"
args   = ["--first-run", "{UserLocalAppData}\\DeadLetter"]
sha256 = "auto"
timeout_ms = 60000
vital  = false
